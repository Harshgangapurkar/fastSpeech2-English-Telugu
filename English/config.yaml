language: English
dataset: ai4bharat/Svarah
seed: 42
data_dir: data/English
results_dir: Results/English
checkpoint_dir: English/checkpoints
audio:
  sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  fmin: 0
  fmax: 8000
  pitch_fmin: 50
  pitch_fmax: 600
selection:
  train_hours: 5.0
  validation_hours: 1.0
  min_seconds: 0.5
  max_seconds: 30.0
  tolerance_seconds: 60
alignment:
  epochs: 40
  batch_size: 8
  hidden: 192
  lr: 0.001
  max_train_cer: 0.35
training:
  epochs: 150
  batch_size: 8
  lr: 0.0001
  weight_decay: 1.0e-06
  grad_clip: 1.0
  num_workers: 0
model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size:
    - 9
    - 1
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: linear
    energy_quantization: linear
    n_bins: 256
  multi_speaker: true
  max_seq_len: 3000
  max_inference_frames: 3000
